en:
  tecnica: "Canary pine heartwood (tea), sheet metal and fabric"
  texto: "A mixed sculpture depicting the friction of wind on water. The wooden base evokes the seabed, the sheet metal in the middle the surface of the sea, and the tilted fabric the flow of air that creates the waves."
