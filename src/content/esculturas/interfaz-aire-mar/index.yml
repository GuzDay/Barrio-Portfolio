titulo: "Interfaz aire-mar"
tecnica: "Tea, chapa y tela"
texto: "Escultura mixta que representa el rozamiento del viento sobre el agua. La base de madera evoca el fondo marino, la chapa intermedia la superficie del mar y la tela inclinada el flujo del aire que genera las olas."
medidas: "20 x 40 x 20 cm"
estado: disponible
