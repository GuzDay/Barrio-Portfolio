texto: "Escultura conceptual en chapa metálica plegada oxidada basada en el proyecto arquitectónico de la Casa Speth de Miguel Martín Fernández de la Torre. Una pieza directa y sobria que juega con pliegues y planos verticales para reinterpretar la volumetría del edificio."
