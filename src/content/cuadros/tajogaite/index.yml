titulo: "Tajogaite"
tecnica: "Técnica mixta sobre lienzo"
texto: "Obra en blanco y negro que representa la vivienda cubierta por la colada durante la erupción del volcán de Tajogaite en La Palma en 2021. Una pieza sobria y directa que retrata el impacto de la lava sobre el paisaje."
medidas: "50 x 50 cm"
anio: 2021
estado: vendido
