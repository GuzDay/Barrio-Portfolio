titulo: Paisaje roto
tecnica: Técnica mixta sobre lienzo
texto: Obra en técnica mixta (acrílico y pastel al óleo sobre texturas ricas) que refleja una vista aérea de campos cultivados, rotos y fragmentados por el tiempo. A través de la superposición de materia y tonos tierra, la composición evoca un territorio telúrico donde la memoria del paisaje se fusiona con la abstracción.
